# Source catalog for ingest. Each entry = one raw roll file: where it is, how
# to read it, and which transform cleans it. county and roll_type come from the
# transform module (single source), so they are not repeated here.

sources:
  - name: sacramento
    roll_year: 2026
    path: sacramento/2026/secured_roll_public.xlsx
    format: xlsx
    transform: sacramento_secured
    parcels: sacramento/2026/sacramento_parcels.parquet
    characteristics:
      path: sacramento/2026/Characteristics Roll 2026.xlsx
      format: xlsx
      transform: sacramento_characteristics
    transfers:
      path: sacramento/2026/Two-Year Transfer List 07.01.26.xlsx
      format: xlsx
      transform: sacramento_transfers
    tax_rates:
      path: sacramento/2026/sacramento_tra_rates_2025_26.csv
      format: csv
      transform: tra_rates

  - name: sacramento_2026_unsecured
    roll_year: 2026
    path: sacramento/2026/2026_UNSECURED_PUBLIC_FILE.xlsx
    format: xlsx
    transform: sacramento_unsecured

  - name: placer
    roll_year: 2026
    path: placer/2026
    transform: placer_secured
    parcels: placer/2026/placer_parcels.parquet
    # built from the county's published rate schedule PDF by
    # scripts/placer_tra_rates_from_pdf.py
    tax_rates:
      path: placer/2026/placer_tra_rates_2025_26.csv
      format: csv
      transform: tra_rates